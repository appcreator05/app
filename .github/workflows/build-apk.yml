name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CineFlix Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          if [ -f "bun.lock" ]; then
            npm install --package-lock-only || true
          fi
          npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Inject Pre-configured Start.io & Capacitor Android Files
        run: |
          if [ -d "android/app/src/main" ]; then
            cp android-setup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            mkdir -p android/app/src/main/java/com/dsp/reviews
            cp android-setup/MainActivity.java android/app/src/main/java/com/dsp/reviews/MainActivity.java
            cat android-setup/app-build.gradle >> android/app/build.gradle
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Android directory not found."
            exit 1
          fi

      - name: Upload APK as Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: DSP-Reviews-StartIo-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
